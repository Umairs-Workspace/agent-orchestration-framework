<!DOCTYPE html>

  <title>ADR-001 — the screen seam</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!--
    Drawn for 138/ADR-001's `### Diagram` brief, in the aof console style (.aof/diagrams/style.md).
    Assumptions, noted here because the reader was not reachable:
    - Architecture view, minimal light variant, doc-inline size, static.
    - Eight nodes, within the nine-node budget. The brief's "fallback path to the byte gate" is drawn
      as an optional node inside the family zone, because the gate is moved into the door module.
    - The door is the one focal node: it is the only reader of the screen the driver has.
    - Teal marks the screen loop (bytes in, verdicts back, keys out); muted marks what is recorded
      (evidence, the blocked id); dashed marks the no-model fallback.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f3f5f7;
      --color-ink:    #1b1f27;
      --color-muted:  #585f6a;
      --color-accent: #ba2646;
      --font-sans:  Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · 138 / ADR-001</p>
    <h1>The screen seam</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adr-001-screen-seam-title adr-001-screen-seam-desc">
      <title id="adr-001-screen-seam-title">ADR-001 — the screen seam</title>
      <desc id="adr-001-screen-seam-desc">Architecture of the session driver's screen seam: PTY output reaches one door that feeds a headless terminal model, a registry recognises each settled frame, and its verdicts return to the driver, which types, answers, stops or waits; at a stop the door writes the screen to the degrade log, a blocked screen's id rides the drive's result, and with no model the door falls back to the byte gate.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#13766d"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f3f5f7"/>

      <text x="574" y="77" fill="rgba(27,31,39,0.45)" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SRC/TERMINAL · THE FAMILY</text>
