<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adr-001-screen-seam-title adr-001-screen-seam-desc">
      <title id="adr-001-screen-seam-title">ADR-001 — the screen seam</title>
      <desc id="adr-001-screen-seam-desc">Architecture of the session driver's screen seam: PTY output reaches one door that feeds a headless terminal model, a registry recognises each settled frame, and its verdicts return to the driver, which types, answers, stops or waits; at a stop the door writes the screen to the degrade log, a blocked screen's id rides the drive's result, and with no model the door falls back to the byte gate.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#585f6a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ba2646"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#13766d"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f3f5f7"/>

      <!-- ZONE (drawn first) -->
      <rect x="464" y="64" width="500" height="240" rx="8" fill="#1b1f27" fill-opacity="0.02" stroke="#1b1f27" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="480" y="68" width="188" height="12" rx="2" fill="#f3f5f7"/>
      <text x="574" y="77" fill="#1b1f27" fill-opacity="0.45" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SRC/TERMINAL · THE FAMILY</text>

      <!-- ARROWS (before boxes) -->
      <!-- PTY → driver : bytes -->
      <line x1="160" y1="116" x2="214" y2="116" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="168" y="96" width="36" height="12" rx="2" fill="#f3f5f7"/>
      <text x="186" y="105" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BYTES</text>
      <!-- driver → PTY : keys -->
      <line x1="216" y1="148" x2="162" y2="148" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="172" y="156" width="32" height="12" rx="2" fill="#f3f5f7"/>
      <text x="188" y="165" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KEYS</text>
      <!-- driver → door : chunks -->
      <line x1="416" y1="116" x2="482" y2="116" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="424" y="96" width="48" height="12" rx="2" fill="#f3f5f7"/>
      <text x="448" y="105" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHUNKS</text>
      <!-- door → driver : verdicts -->
      <line x1="484" y1="148" x2="418" y2="148" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="420" y="156" width="56" height="12" rx="2" fill="#f3f5f7"/>
      <text x="448" y="165" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICTS</text>
      <!-- door → model : feed -->
      <line x1="684" y1="116" x2="762" y2="116" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="720" y="96" width="32" height="12" rx="2" fill="#f3f5f7"/>
      <text x="736" y="105" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FEED</text>
      <!-- model → registry : settled frame -->
      <line x1="854" y1="164" x2="854" y2="218" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="862" y="186" width="76" height="12" rx="2" fill="#f3f5f7"/>
      <text x="900" y="195" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SETTLED FRAME</text>
      <!-- registry → door : the match -->
      <path d="M 764,252 H 712 Q 704,252 704,244 V 156 Q 704,148 696,148 H 686" fill="none" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="716" y="260" width="36" height="12" rx="2" fill="#f3f5f7"/>
      <text x="734" y="269" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MATCH</text>
      <!-- door → byte gate : no model (fallback) -->
      <line x1="554" y1="164" x2="554" y2="218" stroke="#585f6a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="562" y="186" width="52" height="12" rx="2" fill="#f3f5f7"/>
      <text x="588" y="195" fill="#7a818d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO MODEL</text>
      <!-- door → degrade log : evidence at a stop -->
      <line x1="664" y1="164" x2="664" y2="338" stroke="#585f6a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="672" y="316" width="52" height="12" rx="2" fill="#f3f5f7"/>
      <text x="698" y="325" fill="#7a818d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVIDENCE</text>
      <!-- driver → drive result : the blocked id -->
      <line x1="316" y1="164" x2="316" y2="338" stroke="#585f6a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="324" y="244" width="60" height="12" rx="2" fill="#f3f5f7"/>
      <text x="354" y="253" fill="#7a818d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOCKED ID</text>

      <!-- NODES -->
      <!-- PTY (external) -->
      <rect x="32" y="100" width="128" height="64" rx="8" fill="#f3f5f7"/>
      <rect x="32" y="100" width="128" height="64" rx="8" fill="#1b1f27" fill-opacity="0.03" stroke="#1b1f27" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="40" y="106" width="28" height="12" rx="2" fill="none" stroke="#1b1f27" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="54" y="115" fill="#1b1f27" fill-opacity="0.60" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="96" y="136" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif" text-anchor="middle">PTY</text>
      <text x="96" y="152" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle">node-pty · claude</text>

      <!-- Session driver -->
      <rect x="216" y="100" width="200" height="64" rx="8" fill="#f3f5f7"/>
      <rect x="216" y="100" width="200" height="64" rx="8" fill="#ffffff" stroke="#1b1f27" stroke-width="1"/>
      <rect x="224" y="106" width="28" height="12" rx="2" fill="none" stroke="#1b1f27" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="238" y="115" fill="#1b1f27" fill-opacity="0.80" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
      <text x="316" y="136" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Session driver</text>
      <text x="316" y="152" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle">driveInteractiveClaudeSession</text>

      <!-- Session screen (FOCAL — the door) -->
      <rect x="484" y="100" width="200" height="64" rx="8" fill="#f3f5f7"/>
      <rect x="484" y="100" width="200" height="64" rx="8" fill="#ba2646" fill-opacity="0.08" stroke="#ba2646" stroke-width="1.2"/>
      <rect x="492" y="106" width="32" height="12" rx="2" fill="none" stroke="#ba2646" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="508" y="115" fill="#ba2646" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOOR</text>
      <text x="584" y="136" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Session screen</text>
      <text x="584" y="152" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle">session-screen.mjs</text>

      <!-- Screen model -->
      <rect x="764" y="100" width="180" height="64" rx="8" fill="#f3f5f7"/>
      <rect x="764" y="100" width="180" height="64" rx="8" fill="#ffffff" stroke="#1b1f27" stroke-width="1"/>
      <rect x="772" y="106" width="36" height="12" rx="2" fill="none" stroke="#1b1f27" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="790" y="115" fill="#1b1f27" fill-opacity="0.80" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="854" y="136" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Screen model</text>
      <text x="854" y="152" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle">screen.mjs · @xterm/headless</text>

      <!-- Screen registry -->
      <rect x="764" y="220" width="180" height="64" rx="8" fill="#f3f5f7"/>
      <rect x="764" y="220" width="180" height="64" rx="8" fill="#ffffff" stroke="#1b1f27" stroke-width="1"/>
      <rect x="772" y="226" width="28" height="12" rx="2" fill="none" stroke="#1b1f27" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="786" y="235" fill="#1b1f27" fill-opacity="0.80" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="854" y="256" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Screen registry</text>
      <text x="854" y="272" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle">claude-screens.mjs</text>

      <!-- Byte gate (optional — the fallback) -->
      <rect x="484" y="220" width="140" height="64" rx="8" fill="#f3f5f7"/>
      <rect x="484" y="220" width="140" height="64" rx="8" fill="#1b1f27" fill-opacity="0.02" stroke="#1b1f27" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="554" y="252" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Byte gate</text>
      <text x="554" y="268" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle">today's ?2004h gate</text>

      <!-- Degrade log (store) -->
      <rect x="484" y="340" width="200" height="64" rx="8" fill="#f3f5f7"/>
      <rect x="484" y="340" width="200" height="64" rx="8" fill="#1b1f27" fill-opacity="0.05" stroke="#585f6a" stroke-width="1"/>
      <rect x="492" y="346" width="28" height="12" rx="2" fill="none" stroke="#585f6a" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="506" y="355" fill="#585f6a" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
      <text x="584" y="376" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Degrade log</text>
      <text x="584" y="392" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle">degrade.log · rendered rows</text>

      <!-- Drive result (store) -->
      <rect x="216" y="340" width="200" height="64" rx="8" fill="#f3f5f7"/>
      <rect x="216" y="340" width="200" height="64" rx="8" fill="#1b1f27" fill-opacity="0.05" stroke="#585f6a" stroke-width="1"/>
      <rect x="224" y="346" width="32" height="12" rx="2" fill="none" stroke="#585f6a" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="240" y="355" fill="#585f6a" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
      <text x="316" y="376" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Drive result</text>
      <text x="316" y="392" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle">--json · screen.id</text>

      <!-- LEGEND (bottom strip) -->
      <line x1="30" y1="428" x2="970" y2="428" stroke="#1b1f27" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="30" y="452" fill="#585f6a" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="444" width="16" height="12" rx="3" fill="#ba2646" fill-opacity="0.08" stroke="#ba2646" stroke-width="1"/>
      <text x="124" y="453" fill="#585f6a" font-size="9" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif">The one screen reader (focal)</text>
      <rect x="276" y="444" width="16" height="12" rx="3" fill="#ffffff" stroke="#1b1f27" stroke-width="1"/>
      <text x="300" y="453" fill="#585f6a" font-size="9" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif">aof module</text>
