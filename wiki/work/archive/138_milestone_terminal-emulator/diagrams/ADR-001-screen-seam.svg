      <rect x="540" y="444" width="16" height="12" rx="3" fill="#1b1f27" fill-opacity="0.02" stroke="#1b1f27" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="564" y="453" fill="#585f6a" font-size="9" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif">Fallback</text>
