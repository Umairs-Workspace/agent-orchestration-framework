<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ADR-001-daemon-cost-flow-title ADR-001-daemon-cost-flow-desc">
<title id="ADR-001-daemon-cost-flow-title">AOF daemon cost flow</title>
<desc id="ADR-001-daemon-cost-flow-desc">The counter sites in the mesh serve and mesh ui daemons feed one cost meter per process, which reads CPU and event-loop utilisation and holds the budget. Every 15 seconds each daemon writes a cost snapshot under the mesh directory. aof mesh status and the aof work doctor lane read the snapshots. The desktop guard samples each daemon's CPU from the operating system and judges it against the budget and state the status read hands it.</desc>
<style>.name{font:600 12px Inter,system-ui,sans-serif;fill:#1b1f27}.sub{font:9px ui-monospace,Consolas,monospace;fill:#585f6a}.label{font:8px ui-monospace,Consolas,monospace;fill:#585f6a;letter-spacing:.06em}</style>
