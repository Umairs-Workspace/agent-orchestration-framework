  <!--
    Drawn for 134/ADR-003's Diagram brief, in the aof console style (.aof/diagrams/style.md).
    Assumptions, noted here because the reader was not reachable:
    - Data-flow view, left to right, static, doc-inline size.
    - The brief's "harness" and "transcript" are one node: the harness writes the transcript and
      nothing else reads the harness. "Doctor lane" and "continue door" are one node, because
      ADR-005 §4 has them call one pure function. That leaves nine nodes.
    - An "Agent" node (the refine session) is added. Without it the reader cannot see that the
      agent's only arrow goes into EXAMPLES.md.
    - Crimson marks the one reader (focal) and the agent's one write. Teal marks the anchor chain.
      Dashed marks the live path for a running run, and the ask.
  -->

    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
