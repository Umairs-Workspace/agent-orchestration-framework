<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review records pushed to the open editor · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f3f5f7; color: #1b1f27; padding: 2rem; }
    .frame { max-width: 1040px; margin: 0 auto; }
    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <!-- Assumptions (reader not reachable): one diagram covers the happy path and the degrade path as
       one ALT fragment; the re-stamp's return is folded into the event it produces to stay inside
       the 12-message budget. -->
  <div class="frame">
    <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Review records pushed to the open editor</title>
      <desc id="d">The editor opens an event stream; the board face stamps the diagram and watches its directories. When the architect's CLI writes a record, the watch fires, the face re-stamps and sends a review event, and the editor re-reads the proposals. If the watch cannot start, the face ticks every two seconds instead.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#585f6a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ba2646"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#13766d"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#585f6a" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f3f5f7"/>

      <!-- LIFELINES — CLI 140 · store 380 · face 620 · editor 860 -->
      <line x1="140" y1="128" x2="140" y2="672" stroke="rgba(27,31,39,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="380" y1="128" x2="380" y2="672" stroke="rgba(27,31,39,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="620" y1="128" x2="620" y2="672" stroke="rgba(27,31,39,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="860" y1="128" x2="860" y2="672" stroke="rgba(27,31,39,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ACTIVATION — the face holds the stream open; the editor re-reads -->
      <rect x="616" y="176" width="8" height="464" fill="rgba(27,31,39,0.06)" stroke="#585f6a" stroke-width="0.8"/>
      <rect x="856" y="480" width="8" height="40" fill="rgba(27,31,39,0.06)" stroke="#585f6a" stroke-width="0.8"/>

      <!-- M0 editor → face: open the stream -->
      <line x1="860" y1="176" x2="626" y2="176" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="692" y="156" width="96" height="12" rx="2" fill="#f3f5f7"/>
      <text x="740" y="165" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">GET /EVENTS</text>

      <!-- M1 face → store: stamp -->
      <line x1="616" y1="216" x2="384" y2="216" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="460" y="196" width="80" height="12" rx="2" fill="#f3f5f7"/>
      <text x="500" y="205" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">STAMP</text>

      <!-- M2 store → face: stamp + watch dirs (return) -->
      <line x1="380" y1="248" x2="614" y2="248" stroke="#585f6a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="448" y="228" width="104" height="12" rx="2" fill="#f3f5f7"/>
      <text x="500" y="237" fill="#585f6a" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">STAMP · DIRS</text>

      <!-- M3 face self: arm the watch -->
      <path d="M 624 272 L 656 272 Q 664 272 664 280 L 664 288 Q 664 296 656 296 L 628 296" fill="none" stroke="#585f6a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="676" y="288" fill="#585f6a" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="0.06em">ARM WATCH</text>

      <!-- ALT fragment -->
      <rect x="88" y="320" width="824" height="340" rx="4" fill="rgba(27,31,39,0.02)" stroke="rgba(27,31,39,0.22)" stroke-width="1"/>
      <rect x="88" y="320" width="40" height="16" rx="2" fill="#f3f5f7" stroke="rgba(27,31,39,0.22)" stroke-width="1"/>
      <text x="108" y="332" fill="#585f6a" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="152" y="356" fill="#585f6a" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="0.04em">[watch armed]</text>

      <!-- M4 CLI → store: the architect writes a record -->
      <line x1="140" y1="384" x2="376" y2="384" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="212" y="364" width="96" height="12" rx="2" fill="#f3f5f7"/>
      <text x="260" y="373" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PROPOSE</text>

      <!-- M5 store → face: watch event (async) -->
      <line x1="380" y1="416" x2="614" y2="416" stroke="#585f6a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="452" y="396" width="96" height="12" rx="2" fill="#f3f5f7"/>
      <text x="500" y="405" fill="#585f6a" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WATCH EVENT</text>

      <!-- M6 face → store: re-stamp -->
      <line x1="616" y1="448" x2="384" y2="448" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="460" y="428" width="80" height="12" rx="2" fill="#f3f5f7"/>
      <text x="500" y="437" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">RE-STAMP</text>

      <!-- M7 face → editor: the event (headline) -->
      <line x1="624" y1="480" x2="854" y2="480" stroke="#ba2646" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="688" y="460" width="104" height="12" rx="2" fill="#f3f5f7"/>
      <text x="740" y="469" fill="#ba2646" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">EVENT: REVIEW</text>

      <!-- M8 editor → face: re-read through the existing action -->
      <line x1="856" y1="512" x2="626" y2="512" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="680" y="492" width="120" height="12" rx="2" fill="#f3f5f7"/>
      <text x="740" y="501" fill="#13766d" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">POST PROPOSALS</text>

      <!-- divider -->
      <line x1="96" y1="540" x2="904" y2="540" stroke="rgba(27,31,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="152" y="564" fill="#585f6a" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="0.04em">[watch cannot start]</text>

      <!-- M9 face self: tick and re-stamp -->
      <path d="M 624 584 L 656 584 Q 664 584 664 592 L 664 600 Q 664 608 656 608 L 628 608" fill="none" stroke="#585f6a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="676" y="600" fill="#585f6a" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="0.06em">TICK 2 S · RE-STAMP</text>

      <!-- M10 face → editor: the event, by tick -->
      <line x1="624" y1="640" x2="854" y2="640" stroke="#585f6a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="688" y="620" width="104" height="12" rx="2" fill="#f3f5f7"/>
      <text x="740" y="629" fill="#585f6a" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">EVENT: REVIEW</text>

      <!-- ACTORS — drawn after arrows -->
      <!-- architect CLI: external -->
      <rect x="64" y="72" width="152" height="56" rx="8" fill="#f3f5f7"/>
      <rect x="64" y="72" width="152" height="56" rx="8" fill="rgba(27,31,39,0.03)" stroke="rgba(27,31,39,0.30)" stroke-width="1"/>
      <rect x="72" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(27,31,39,0.30)" stroke-width="0.8"/>
      <text x="86" y="89" fill="#585f6a" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="140" y="104" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Architect session</text>
      <text x="140" y="119" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">diagram scene</text>

      <!-- review store: store -->
      <rect x="304" y="72" width="152" height="56" rx="8" fill="#f3f5f7"/>
      <rect x="304" y="72" width="152" height="56" rx="8" fill="rgba(27,31,39,0.05)" stroke="#585f6a" stroke-width="1"/>
      <rect x="312" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(88,95,106,0.40)" stroke-width="0.8"/>
      <text x="330" y="89" fill="#585f6a" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="380" y="104" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Review records</text>
      <text x="380" y="119" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">&lt;stem&gt;.review/</text>

      <!-- board face: focal -->
      <rect x="544" y="72" width="152" height="56" rx="8" fill="#f3f5f7"/>
      <rect x="544" y="72" width="152" height="56" rx="8" fill="rgba(186,38,70,0.08)" stroke="#ba2646" stroke-width="1"/>
      <rect x="552" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(186,38,70,0.50)" stroke-width="0.8"/>
      <text x="568" y="89" fill="#ba2646" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FACE</text>
      <text x="620" y="104" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Events route</text>
      <text x="620" y="119" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">stamp · watch</text>

      <!-- editor: backend/app -->
      <rect x="784" y="72" width="152" height="56" rx="8" fill="#f3f5f7"/>
      <rect x="784" y="72" width="152" height="56" rx="8" fill="#ffffff" stroke="#1b1f27" stroke-width="1"/>
      <rect x="792" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(27,31,39,0.30)" stroke-width="0.8"/>
      <text x="806" y="89" fill="#585f6a" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="860" y="104" fill="#1b1f27" font-size="12" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Editor</text>
      <text x="860" y="119" fill="#585f6a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">EventSource</text>

      <!-- LEGEND -->
      <line x1="64" y1="688" x2="936" y2="688" stroke="rgba(27,31,39,0.12)" stroke-width="0.8"/>
      <text x="64" y="708" fill="#585f6a" font-size="8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="64" y1="728" x2="92" y2="728" stroke="#13766d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="100" y="731" fill="#585f6a" font-size="8.5" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Call</text>
      <line x1="200" y1="728" x2="228" y2="728" stroke="#585f6a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="236" y="731" fill="#585f6a" font-size="8.5" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Return</text>
      <line x1="336" y1="728" x2="364" y2="728" stroke="#585f6a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="372" y="731" fill="#585f6a" font-size="8.5" font-family="Inter, ui-sans-serif, system-ui, sans-serif">File-system event</text>
      <line x1="504" y1="728" x2="532" y2="728" stroke="#ba2646" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="540" y="731" fill="#585f6a" font-size="8.5" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Pushed event (look now)</text>
    </svg>
  </div>
</body>
</html>
