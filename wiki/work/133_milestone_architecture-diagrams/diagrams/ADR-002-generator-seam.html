    - Architecture view, minimal light variant, doc-inline size, static.
    - The brief names eleven components and the skill's budget is nine nodes, so two merges:
      the registry is drawn inside the focal adapter box (`generatorFor(id)`), and
      `ARCHITECTURE.md` + `diagrams/` are one "item folder" node — the pasted block and the files
      live together there.
