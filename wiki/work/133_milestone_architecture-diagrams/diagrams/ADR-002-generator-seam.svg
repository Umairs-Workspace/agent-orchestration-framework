<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adr-002-generator-seam-title adr-002-generator-seam-desc">
      <title id="adr-002-generator-seam-title">ADR-002 — the generator seam</title>
      <desc id="adr-002-generator-seam-desc">Architecture of aof's diagram seam: config and the plan command reach one generator adapter that hands the drawing to a swappable skill, and the export command turns the drawn source into an SVG and a PNG in the item folder, which the doctor lane checks and the console renders.</desc>
