      <rect x="788" y="68" width="176" height="12" rx="2" fill="#f3f5f7"/>
      <text x="876" y="77" fill="#1b1f27" fill-opacity="0.45" font-size="7" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GENERATOR · HOW · SWAPPABLE</text>

