# docs/_config.yml — the published site's configuration (story 125).
#
# This directory is the site's SHELL and nothing else: this config, one layout and the landing
# page. The pages the site publishes are not here — `scripts/site/build-site.mjs` stages them
# beside this shell at build time (the loop graph from the committed document, the two planning
# PRDs from wiki/planning/), into a git-ignored directory Jekyll then builds from. A committed
# copy of the graph document would be true on the day it merged and quietly wrong within a
# milestone, which is the defect this site exists to remove.
#
# Built by `actions/jekyll-build-pages` (the github-pages gem: Jekyll 3, kramdown with GFM input,
# rouge). Nothing here needs a plugin.
title: "aof — the loop machinery"
description: "The control loops that drive aof's own delivery, projected from the loop registry rather than described from memory."

# The project site's home. `baseurl` is the repository name, which is where GitHub Pages serves a
# project site; the README links exactly this address.
url: "https://umairb.github.io"
baseurl: "/agent-orchestration-framework"
# The repository the pages are projected from. The layout resolves an authored page's RELATIVE
# links (a PRD's `../../src/x.mjs`) against its provenance path into this repository's blob URLs,
# so a link the author wrote for the tree still lands somewhere on the site.
repository: "UmairB/agent-orchestration-framework"

markdown: kramdown
kramdown:
  input: GFM
  # A ```mermaid fence reaches the page as <pre><code class="language-mermaid"> — rouge has no
  # mermaid lexer, so kramdown falls back to the plain shape — and the layout promotes that node
  # before Mermaid runs. Nothing to configure here; recorded so nobody adds a highlighter option
  # that changes the shape the layout selects.
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default
